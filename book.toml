[book]
authors = ["Atum"]
language = "en"
src = "src"
title = "The Self-Evolving Agent"
description = "How top-tier production agents — Claude Code, Cursor, Hermes, OpenClaw, Manus, Codex — actually get better through use. Extracted from leaked source, open repos, and shipped products."

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/A7um/AgentEnvolveBook"
edit-url-template = "https://github.com/A7um/AgentEnvolveBook/edit/main/{path}"
site-url = "/AgentEnvolveBook/"
print = { enable = false }
additional-css = ["book-zoom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "book-zoom.js"]

[output.html.search]
enable = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

